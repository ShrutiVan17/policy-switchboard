<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title"><title id="title">Message enters FastAPI authentication, trusted ticket context and deterministic policy checks. Rules output or human review is separate from privacy-filtered MiniLM plus customer LoRA research comparisons, which deliver no customer messages.</title><defs><linearGradient id="hero" x2="1" y2="1"><stop stop-color="#241739"/><stop offset="1" stop-color="#42305f"/></linearGradient></defs><rect x="2" y="2" width="1196" height="606" rx="30" fill="#f6f4fb" stroke="#e5dff0" stroke-width="2"/><text x="54" y="78" fill="#241739" font-family="Arial, Helvetica, sans-serif" font-size="53" font-weight="700" text-anchor="start">How it works</text><rect x="45" y="172" width="205" height="127" rx="24" fill="#fff" stroke="#e5dff0" stroke-width="2"/><text x="147" y="219" fill="#241739" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" text-anchor="middle">Message</text><text x="147" y="265" fill="#7b688b" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle">input</text><path d="M250 235 H270" fill="none" stroke="#7853ec" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="270" y="172" width="205" height="127" rx="24" fill="#fff" stroke="#e5dff0" stroke-width="2"/><text x="372" y="219" fill="#241739" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" text-anchor="middle">FastAPI</text><text x="372" y="265" fill="#7b688b" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle">tenant auth</text><path d="M475 235 H495" fill="none" stroke="#7853ec" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="495" y="172" width="205" height="127" rx="24" fill="#fff" stroke="#e5dff0" stroke-width="2"/><text x="597" y="219" fill="#241739" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" text-anchor="middle">Ticket facts</text><text x="597" y="265" fill="#7b688b" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle">trusted context</text><path d="M700 235 H720" fill="none" stroke="#7853ec" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="720" y="172" width="205" height="127" rx="24" fill="#fff" stroke="#e5dff0" stroke-width="2"/><text x="822" y="219" fill="#241739" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" text-anchor="middle">Rules</text><text x="822" y="265" fill="#7b688b" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle">policy checks</text><path d="M925 235 H945" fill="none" stroke="#7853ec" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="945" y="172" width="205" height="127" rx="24" fill="#fff" stroke="#e5dff0" stroke-width="2"/><text x="1047" y="219" fill="#241739" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" text-anchor="middle">Output</text><text x="1047" y="265" fill="#7b688b" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle">or review</text><path d="M822 299 V335 H685 V381" fill="none" stroke="#7853ec" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 9"/><text x="555" y="346" fill="#745e8d" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start">Secret pre-filter</text><rect x="486" y="385" width="400" height="128" rx="24" fill="#ede7f9" stroke="#d8c9f2" stroke-width="2"/><text x="686" y="433" fill="#7853ec" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" text-anchor="middle">MiniLM + customer LoRA</text><text x="686" y="478" fill="#765392" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="middle">trained verdict head</text>
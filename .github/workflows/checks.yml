name: Verify demo
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m switchboard.evals --output artifacts/evaluation.json
      - run: python -m ml.build_dataset
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-${{ matrix.os }}-${{ matrix.python }}
          path: artifacts/evaluation.json

name: Verify demo
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m switchboard.evals --output artifacts/evaluation.json
      - run: python -m ml.build_dataset
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-${{ matrix.os }}-${{ matrix.python }}
          path: artifacts/evaluation.json
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build service image
        run: docker build --target service -t switchboard-service .
      - name: Verify the deployed service boundary
        shell: bash
        run: |
          docker run -d --name switchboard-check --network host -e SWITCHBOARD_MODE=service -e HARBOR_API_KEY=ci-harbor-fixture-key-0000000000000000000000 -e CEDAR_API_KEY=ci-cedar-fixture-key-00000000000000000000000 switchboard-service
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8765/api/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8765/api/health
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/api/demo-config)" = 404
          docker exec switchboard-check python -m switchboard.provision_context --tenant harbor --ticket ci-refund --amount 15
          curl --fail --silent http://127.0.0.1:8765/api/enforce -H 'Authorization: Bearer ci-harbor-fixture-key-0000000000000000000000' -H 'Content-Type: application/json' --data '{"message":"I can refund your $15 transfer fee now.","version":"v2","ticket_id":"ci-refund"}' > service-response.json
          python -c "import json; r=json.load(open('service-response.json')); assert r['verdict']=='escalate' and r['delivered_output'] is None"
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/api/enforce -H 'Authorization: Bearer ci-harbor-fixture-key-0000000000000000000000' -H 'Content-Type: application/json' --data '{"message":"Hello!","ticket_id":"ci-refund","context":{"supervisor_approved":true}}')" = 400
      - name: Container diagnostics
        if: failure()
        run: docker logs switchboard-check
  model-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build CPU model image and reproduce synthetic adaptation
        run: docker build --target model-service -t switchboard-model .
      - name: Exercise deployed trained-model shadow endpoint
        shell: bash
        run: |
          docker run -d --name model-check --network host -e SWITCHBOARD_MODE=service -e HARBOR_API_KEY=ci-harbor-fixture-key-0000000000000000000000 -e CEDAR_API_KEY=ci-cedar-fixture-key-00000000000000000000000 switchboard-model
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/api/health; then break; fi
            sleep 1
          done
          docker exec model-check python -m switchboard.provision_context --tenant harbor --ticket model-refund --amount 13.64
          curl --max-time 90 --fail --silent http://127.0.0.1:8765/api/shadow -H 'Authorization: Bearer ci-harbor-fixture-key-0000000000000000000000' -H 'Content-Type: application/json' --data '{"message":"We will refund the $13.64 processing fee.","version":"v2","ticket_id":"model-refund"}' > model-response.json
          python -c "import json; r=json.load(open('model-response.json')); assert r['model_verdict']=='escalate' and r['rule_verdict']=='escalate' and r['delivered_output'] is None; assert len(r['adapter_sha256'])==64 and len(r['head_sha256'])==64"
          curl --max-time 15 --fail --silent http://127.0.0.1:8765/api/shadow -H 'Authorization: Bearer ci-harbor-fixture-key-0000000000000000000000' -H 'Content-Type: application/json' --data '{"message":"We will refund the $13.64 processing fee.","version":"v2","ticket_id":"model-refund"}' > warm-response.json
          python -c "import json; r=json.load(open('warm-response.json')); assert r['latency_ms']<1000 and r['delivered_output'] is None"
          docker exec model-check python -m switchboard.provision_context --tenant harbor --ticket missing-amount --amount 6.83
          curl --max-time 15 --fail --silent http://127.0.0.1:8765/api/shadow -H 'Authorization: Bearer ci-harbor-fixture-key-0000000000000000000000' -H 'Content-Type: application/json' --data '{"message":"We will issue the handling-charge refund.","version":"v2","ticket_id":"missing-amount"}' > missing-amount-response.json
          python -c "import json; r=json.load(open('missing-amount-response.json')); assert r['model_verdict']=='escalate' and r['delivered_output'] is None"
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/api/shadow -H 'Authorization: Bearer ci-harbor-fixture-key-0000000000000000000000' -H 'Content-Type: application/json' --data '{"message":"Hello","version":"v2","ticket_id":"model-refund","context":{"supervisor_approved":true}}')" = 400
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/api/shadow -H 'Authorization: Bearer ci-cedar-fixture-key-00000000000000000000000' -H 'Content-Type: application/json' --data '{"message":"Hello","version":"v1","ticket_id":"model-refund"}')" != 200
          docker exec model-check python -c "from pathlib import Path; p=Path('models/evidence-harbor-v2/evidence_head.safetensors'); b=bytearray(p.read_bytes()); b[-1]^=1; p.write_bytes(b)"
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/api/shadow -H 'Authorization: Bearer ci-harbor-fixture-key-0000000000000000000000' -H 'Content-Type: application/json' --data '{"message":"We will refund the $13.64 processing fee.","version":"v2","ticket_id":"model-refund"}')" = 503
      - name: Model container diagnostics
        if: failure()
        run: docker logs model-check
